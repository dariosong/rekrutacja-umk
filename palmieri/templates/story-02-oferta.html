<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Palmieri — Story 02 · Oferta wyjazdu</title>
<link rel="stylesheet" href="../brand/fonts.css">
<link rel="stylesheet" href="../brand/tokens.css">
<link rel="stylesheet" href="../brand/palmieri.css">
<script defer src="../brand/sygnet.js"></script>
<script defer src="../content/wyjazdy.js"></script>
<script defer src="../content/apply.js"></script>
</head>

<!--
  STORY 02 — OFERTA WYJAZDU (1080 × 1920)
  Układ dwudzielny: zdjęcie u góry, warunki na granacie u dołu.
  Konkret w jednym rzucie oka: kierunek, termin, cena, co jest w cenie.
-->

<body data-wyjazd="ziemia-swieta">

<div class="p-canvas p-canvas--9x16" data-export="story-02-oferta" data-safe="story">

  <!-- zdjęcie zajmuje górne 46% kadru -->
  <div class="p-photo p-photo--duotone" data-photo style="bottom:54%;"></div>
  <div class="p-scrim p-scrim--soft" style="bottom:54%;"></div>
  <div class="p-scrim" style="bottom:54%; background:linear-gradient(to top, rgb(22 36 63 / 1) 0%, rgb(22 36 63 / 0) 30%);"></div>
  <p class="p-photo-note">Zdjęcie zastępcze</p>

  <div class="p-arc" style="width:120cqw; height:120cqw; right:-56cqw; bottom:2cqh; --arc-opacity:.12;"></div>

  <div class="p-stack p-stack--between p-inset-story p-layer">

    <div class="p-row p-row--between">
      <div class="p-lockup p-lockup--cream" style="--sygnet:8.4cqw;">
        <span class="p-sygnet"></span>
        <span class="p-lockup__word">Palmieri</span>
      </div>
      <span class="p-badge p-badge--cream" data-p="eyebrow">Pielgrzymka · 8 dni</span>
    </div>

    <div>
      <p class="p-eyebrow" data-p="podtytul">Jerozolima · Betlejem · Galilea</p>
      <h1 class="p-title" style="margin-top:var(--p-space-2);" data-p="kierunek">Ziemia Święta</h1>

      <div class="p-hr" style="margin-block:var(--p-space-4);"></div>

      <div class="p-row p-row--between" style="align-items:flex-end;">
        <div>
          <p class="p-label" style="color:var(--p-cream-60);">Termin</p>
          <p style="margin:var(--p-space-1) 0 0; font-size:var(--p-step-1);" data-p="terminKrotki">14–21 X 2026</p>
        </div>
        <div class="p-price">
          <span class="p-price__from">od</span>
          <span class="p-price__value" data-p="cena">6 890</span>
          <span class="p-price__unit" data-p="waluta">zł</span>
        </div>
      </div>

      <p class="p-lead" style="margin-top:var(--p-space-3); font-size:var(--p-step-0);" data-p="cenaNota">
        Przelot, hotele, wyżywienie i opieka kapłana w cenie.
      </p>

      <div class="p-row" style="margin-top:var(--p-space-4); gap:var(--p-space-2);">
        <span class="p-cta" data-p="cta">Zapisz się</span>
        <span class="p-cta p-cta--ghost" data-p="marka.www">palmieri.pl</span>
      </div>
    </div>

  </div>
</div>

</body>
</html>
