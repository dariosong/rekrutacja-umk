<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Palmieri — Shorts 04 · Trzy punkty</title>
<link rel="stylesheet" href="../brand/fonts.css">
<link rel="stylesheet" href="../brand/tokens.css">
<link rel="stylesheet" href="../brand/palmieri.css">
<script defer src="../brand/sygnet.js"></script>
<script defer src="../content/wyjazdy.js"></script>
<script defer src="../content/apply.js"></script>

<!--
  SHORTS 04 — TRZY PUNKTY (1080 × 1920)
  Plansza wyliczenia: „co zobaczysz", „dlaczego warto", „o czym pamiętać".
  Lista bierze pozycje z pola `punkty` wybranego wyjazdu i sama je numeruje —
  wystarczy dopisać kolejny wiersz w content/wyjazdy.js.
-->

<body data-wyjazd="ziemia-swieta">

<div class="p-canvas p-canvas--9x16" data-export="shorts-04-lista" data-safe="shorts">

  <div class="p-arc" style="width:150cqw; height:150cqw; left:-58cqw; top:-52cqw; --arc-opacity:.14;"></div>
  <div class="p-grain"></div>

  <div class="p-stack p-stack--between p-inset-shorts p-inset-icons p-layer">

    <div>
      <div class="p-lockup p-lockup--gold" style="--sygnet:9cqw;">
        <span class="p-sygnet"></span>
        <span class="p-lockup__word">Palmieri</span>
      </div>

      <p class="p-eyebrow" style="margin-top:var(--p-space-5);" data-p="kierunek">Ziemia Święta</p>
      <h1 class="p-title" style="margin-top:var(--p-space-2); font-size:var(--p-step-4);">
        Trzy chwile, dla których<br>warto tam pojechać
      </h1>
    </div>

    <ol class="p-list" data-p-list="punkty" style="gap:var(--p-space-4);">
      <li class="p-list__item" style="align-items:flex-start;">
        <span class="p-list__no" data-slot="numer" style="font-size:var(--p-step-3); min-width:9cqw;">01</span>
        <span class="p-list__text" data-slot="opis" style="font-size:var(--p-step-2); line-height:1.26;">
          Msza w Bazylice Grobu Pańskiego
        </span>
      </li>
    </ol>

    <div>
      <div class="p-hr"></div>
      <div class="p-signature" style="margin-top:var(--p-space-3);">
        <span data-p="terminKrotki">14–21 X 2026</span>
        <span data-p="marka.www">palmieri.pl</span>
      </div>
    </div>

  </div>
</div>

</body>
</html>
