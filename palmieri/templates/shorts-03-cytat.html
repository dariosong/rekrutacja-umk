<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Palmieri — Shorts 03 · Cytat</title>
<link rel="stylesheet" href="../brand/fonts.css">
<link rel="stylesheet" href="../brand/tokens.css">
<link rel="stylesheet" href="../brand/palmieri.css">
<script defer src="../brand/sygnet.js"></script>
<script defer src="../content/wyjazdy.js"></script>
<script defer src="../content/apply.js"></script>
</head>

<!--
  SHORTS 03 — CYTAT / SŁOWO NA DZIŚ (1080 × 1920)
  Plansza na jasnym, kremowym tle — celowy oddech w strumieniu ciemnych kadrów.
  Kursywa Cormorant Garamond, tak jak sentencja w księdze znaku.
  Podmień treść przez ?cytat=... albo wprost w pliku.
-->

<body data-wyjazd="ziemia-swieta">

<div class="p-canvas p-canvas--9x16 p-canvas--cream" data-export="shorts-03-cytat" data-safe="shorts">

  <div class="p-frame" style="--frame-inset:5.2cqw; --frame-color:var(--p-gold-24);"></div>

  <div class="p-arc" style="width:104cqw; height:104cqw; right:-52cqw; top:12cqh; --arc-opacity:.22;"></div>

  <div class="p-stack p-stack--between p-center p-inset-shorts p-layer">

    <span class="p-sygnet p-sygnet--gold" style="--sygnet:16cqw;"></span>

    <div>
      <p class="p-eyebrow">Słowo na drogę</p>

      <blockquote class="p-quote" data-p="cytat"
        style="margin-top:var(--p-space-4); font-size:var(--p-step-4); line-height:1.24; max-width:78cqw;">
        Palma to znak człowieka, który przeszedł realną, duchową drogę — i wrócił inny.
      </blockquote>

      <div class="p-rule" style="--rule-w:26cqw; margin:var(--p-space-4) auto 0;">
        <i class="p-diamond"></i>
      </div>

      <p class="p-label" style="margin-top:var(--p-space-3); color:var(--p-ink-55);" data-p="zrodlo">
        Księga znaku Palmieri
      </p>
    </div>

    <p class="p-label" style="color:var(--p-gold);" data-p="marka.haslo">
      Pielgrzymki dla wymagających
    </p>

  </div>
</div>

</body>
</html>
