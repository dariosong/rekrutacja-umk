<!--

  Obraz nagłówkowy reklamy prowadzącej na stronę wyjazdu, do udostępnień

<body data-wyjazd="ziemia-swieta">

<div class="p-canvas p-canvas--191x1 is-wide" data-export="ad-04-link-1200x628">

  <div class="p-photo p-photo--duotone" data-photo style="right:56%;"></div>
  <div class="p-scrim p-scrim--soft" style="right:56%;"></div>

  <div class="p-stack p-stack--between p-layer" style="left:44%; padding-left:0;">

    <div class="p-row p-row--between">

      <div class="p-price">
        <span class="p-price__from">od</span>
        <span class="p-price__value" style="font-size:var(--p-step-4);" data-p="cena">6 890</span>

      </div>
      <span class="p-cta" style="padding:1.5cqw 3cqw;" data-p="cta">Zapisz się</span>

  </div>
