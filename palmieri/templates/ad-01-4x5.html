<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Palmieri — Reklama 01 · Wyjazd 4:5</title>
<link rel="stylesheet" href="../brand/fonts.css">
<link rel="stylesheet" href="../brand/tokens.css">
<link rel="stylesheet" href="../brand/palmieri.css">
<script defer src="../brand/sygnet.js"></script>
<script defer src="../content/wyjazdy.js"></script>
<script defer src="../content/apply.js"></script>
</head>

<!--
  REKLAMA 01 — WYJAZD, FORMAT 4:5 (1080 × 1350)
  Podstawowy format reklamy w kanale Facebooka i Instagrama.
  Kolejność czytania: kierunek → termin → cena → wezwanie.
  Tekstu na obrazie mało: reszta argumentów należy do treści reklamy.
-->

<body data-wyjazd="ziemia-swieta">

<div class="p-canvas p-canvas--4x5" data-export="ad-01-4x5">

  <div class="p-photo p-photo--duotone" data-photo style="bottom:47%;"></div>
  <div class="p-scrim p-scrim--soft" style="bottom:47%;"></div>
  <div class="p-scrim" style="bottom:47%; background:linear-gradient(to top, rgb(22 36 63 / 1) 4%, rgb(22 36 63 / 0) 34%);"></div>
  <p class="p-photo-note">Zdjęcie zastępcze</p>

  <div class="p-arc" style="width:104cqw; height:104cqw; right:-50cqw; bottom:-24cqw; --arc-opacity:.12;"></div>

  <div class="p-stack p-stack--between p-layer">

    <div class="p-row p-row--between">
      <div class="p-lockup p-lockup--cream" style="--sygnet:9cqw;">
        <span class="p-sygnet"></span>
        <span class="p-lockup__word">Palmieri</span>
      </div>
      <span class="p-badge p-badge--cream" data-p="dni">8 dni</span>
    </div>

    <div>
      <p class="p-eyebrow" data-p="podtytul">Jerozolima · Betlejem · Galilea</p>
      <h1 class="p-title" style="margin-top:var(--p-space-2); font-size:var(--p-step-5);" data-p="kierunek">
        Ziemia Święta
      </h1>

      <div class="p-meta" style="margin-top:var(--p-space-3);">
        <span data-p="termin">14–21 października 2026</span>
        <span data-p="wylot">Wylot z Warszawy</span>
      </div>

      <div class="p-hr" style="margin-block:var(--p-space-4);"></div>

      <div class="p-row p-row--between" style="align-items:center; gap:var(--p-space-4);">
        <div class="p-price">
          <span class="p-price__from">od</span>
          <span class="p-price__value" data-p="cena">6 890</span>
          <span class="p-price__unit" data-p="waluta">zł</span>
        </div>
        <span class="p-cta" data-p="cta">Zapisz się</span>
      </div>

      <p class="p-lead" style="margin-top:var(--p-space-3); font-size:var(--p-step--1); max-width:72cqw;" data-p="cenaNota">
        Przelot, hotele, wyżywienie i opieka kapłana w cenie.
      </p>
    </div>

  </div>
</div>

</body>
</html>
