<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Palmieri — Story 04 · Opinia pielgrzyma</title>
<link rel="stylesheet" href="../brand/fonts.css">
<link rel="stylesheet" href="../brand/tokens.css">
<link rel="stylesheet" href="../brand/palmieri.css">
<script defer src="../brand/sygnet.js"></script>
<script defer src="../content/wyjazdy.js"></script>
<script defer src="../content/apply.js"></script>
</head>

<!--
  STORY 04 — OPINIA PIELGRZYMA (1080 × 1920)
  Jasny, kremowy kadr przerywa serię ciemnych relacji i wyróżnia cudzy głos.
  Jedno zdanie, podpis, kierunek. Bez zdjęcia — liczy się treść.
-->

<body data-wyjazd="ziemia-swieta">

<div class="p-canvas p-canvas--9x16 p-canvas--cream" data-export="story-04-opinia" data-safe="story">

  <div class="p-arc" style="width:96cqw; height:96cqw; left:-38cqw; bottom:6cqh; --arc-opacity:.20;"></div>

  <div class="p-stack p-stack--between p-inset-story p-layer">

    <div class="p-row p-row--between">
      <div class="p-lockup p-lockup--gold" style="--sygnet:8.4cqw;">
        <span class="p-sygnet"></span>
        <span class="p-lockup__word">Palmieri</span>
      </div>
      <span class="p-badge" data-p="kierunek">Ziemia Święta</span>
    </div>

    <div>
      <p class="p-eyebrow">Napisali po powrocie</p>

      <p class="p-numeral" style="font-size:22cqw; line-height:.6; margin:var(--p-space-3) 0 0; color:var(--p-gold-40);">
        &bdquo;
      </p>

      <blockquote class="p-quote" data-p="opinia"
        style="margin-top:var(--p-space-2); font-size:var(--p-step-3); line-height:1.30;">
        Byłam już na kilku pielgrzymkach. Ta pierwszy raz nie była wycieczką z modlitwą, tylko drogą.
      </blockquote>

      <div class="p-row" style="margin-top:var(--p-space-4); gap:var(--p-space-2);">
        <i class="p-diamond p-diamond--sm"></i>
        <p class="p-label" style="color:var(--p-ink-55);" data-p="opiniaAutor">Anna, Toruń</p>
      </div>
    </div>

    <div>
      <div class="p-hr" style="background:var(--p-gold-24);"></div>
      <p class="p-signature" style="margin-top:var(--p-space-3);">
        <span data-p="marka.haslo">Pielgrzymki dla wymagających</span>
        <span data-p="marka.www">palmieri.pl</span>
      </p>
    </div>

  </div>
</div>

</body>
</html>
