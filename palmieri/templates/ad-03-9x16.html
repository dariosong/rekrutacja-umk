<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Palmieri — Reklama 03 · Wyjazd 9:16</title>
<link rel="stylesheet" href="../brand/fonts.css">
<link rel="stylesheet" href="../brand/tokens.css">

<!--
  REKLAMA 03 — WYJAZD, FORMAT PIONOWY (1080 × 1920)
  Do reklam w relacjach i rolkach. Układ trzyma się stref bezpiecznych relacji,
  żeby cena i wezwanie nie schowały się pod interfejsem aplikacji.
-->

<body data-wyjazd="ziemia-swieta">

<div class="p-canvas p-canvas--9x16" data-export="ad-03-9x16" data-safe="story">

  <div class="p-photo p-photo--duotone" data-photo></div>
  <div class="p-scrim p-scrim--soft"></div>
  <div class="p-scrim p-scrim--both"></div>
  <div class="p-grain"></div>
  <p class="p-photo-note">Zdjęcie zastępcze</p>

  <div class="p-stack p-stack--between p-inset-story p-layer">

    <div class="p-row p-row--between">
      <div class="p-lockup p-lockup--cream" style="--sygnet:8.4cqw;">
        <span class="p-sygnet"></span>
        <span class="p-lockup__word">Palmieri</span>
      </div>
      <span class="p-badge p-badge--cream" data-p="dni">8 dni</span>
    </div>

    <div>
      <p class="p-eyebrow" data-p="podtytul">Jerozolima · Betlejem · Galilea</p>
      <h1 class="p-title p-title--xl" style="margin-top:var(--p-space-2);" data-p="kierunek">
        Ziemia Święta
      </h1>

      <div class="p-hr" style="margin-block:var(--p-space-4);"></div>

      <div class="p-meta">
        <span data-p="terminKrotki">14–21 X 2026</span>
        <span data-p="wylot">Wylot z Warszawy</span>
      </div>

      <div class="p-price" style="margin-top:var(--p-space-4);">
        <span class="p-price__from">od</span>
        <span class="p-price__value" data-p="cena">6 890</span>
        <span class="p-price__unit" data-p="waluta">zł</span>
      </div>
      <p class="p-lead" style="margin-top:var(--p-space-2); font-size:var(--p-step--1); max-width:66cqw;" data-p="cenaNota">
        Przelot, hotele, wyżywienie i opieka kapłana w cenie.
      </p>

      <span class="p-cta p-cta--block" style="margin-top:var(--p-space-4);" data-p="cta">Zapisz się</span>
    </div>

  </div>
</div>

</body>
</html>
