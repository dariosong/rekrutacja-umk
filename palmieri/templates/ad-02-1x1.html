<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Palmieri — Reklama 02 · Wyjazd 1:1</title>
<link rel="stylesheet" href="../brand/fonts.css">
<link rel="stylesheet" href="../brand/tokens.css">
<link rel="stylesheet" href="../brand/palmieri.css">
<script defer src="../brand/sygnet.js"></script>
<script defer src="../content/wyjazdy.js"></script>
<script defer src="../content/apply.js"></script>
</head>

<!--
  REKLAMA 02 — WYJAZD, FORMAT KWADRATOWY (1080 × 1080)
  Do kanału, do reklam z kilkoma proporcjami i jako miniatura wydarzenia.
  Pełnoekranowe zdjęcie z przyciemnieniem od dołu — całą treść trzymamy nisko.
-->

<body data-wyjazd="ziemia-swieta">

<div class="p-canvas p-canvas--1x1" data-export="ad-02-1x1">

  <div class="p-photo p-photo--duotone" data-photo style="--photo-pos:center 40%;"></div>
  <div class="p-scrim p-scrim--soft"></div>
  <div class="p-scrim p-scrim--bottom"></div>
  <div class="p-grain"></div>
  <p class="p-photo-note">Zdjęcie zastępcze</p>

  <div class="p-stack p-stack--between p-layer">

    <div class="p-row p-row--between">
      <div class="p-lockup p-lockup--cream" style="--sygnet:9cqw;">
        <span class="p-sygnet"></span>
        <span class="p-lockup__word">Palmieri</span>
      </div>
      <span class="p-badge p-badge--cream" data-p="terminKrotki">14–21 X 2026</span>
    </div>

    <div>
      <p class="p-eyebrow" data-p="eyebrow">Pielgrzymka · 8 dni</p>
      <h1 class="p-title" style="margin-top:var(--p-space-2);" data-p="kierunek">Ziemia Święta</h1>

      <div class="p-rule" style="--rule-w:24cqw; margin-block:var(--p-space-3);">
        <i class="p-diamond"></i>
      </div>

      <div class="p-row p-row--between" style="align-items:flex-end; gap:var(--p-space-4);">
        <div class="p-price">
          <span class="p-price__from">od</span>
          <span class="p-price__value" data-p="cena">6 890</span>
          <span class="p-price__unit" data-p="waluta">zł</span>
        </div>
        <span class="p-cta" data-p="cta">Zapisz się</span>
      </div>
    </div>

  </div>
</div>

</body>
</html>
