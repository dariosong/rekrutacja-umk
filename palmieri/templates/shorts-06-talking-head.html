<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Palmieri — Shorts 06 · Talking head</title>
<link rel="stylesheet" href="../brand/fonts.css">
<link rel="stylesheet" href="../brand/tokens.css">
<link rel="stylesheet" href="../brand/palmieri.css">
<script defer src="../brand/sygnet.js"></script>
<script defer src="../content/wyjazdy.js"></script>
<script defer src="../content/apply.js"></script>
<style>
  /* Obie kanwy są nakładkami na materiał wideo, więc tło zostaje przezroczyste
     — plik PNG kładzie się wprost na ujęciu w programie montażowym. */
  .is-overlay { background: transparent; }
  body { display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; }

  /* Środek kadru zostaje czysty: przyciemniamy tylko górę i dół, żeby nie
     kłaść szarej płachty na twarz mówiącego. */
  .scrim-gora {
    top: 0; bottom: auto; height: 40%;
    background: linear-gradient(to bottom,
      rgb(22 36 63 / .92) 0%, rgb(22 36 63 / .74) 46%, rgb(22 36 63 / 0) 100%);
  }
  .scrim-dol {
    top: auto; bottom: 0; height: 38%;
    background: linear-gradient(to top,
      rgb(22 36 63 / .94) 0%, rgb(22 36 63 / .70) 42%, rgb(22 36 63 / 0) 100%);
  }
  .scrim-gora--niski { height: 24%; }
</style>
</head>

<!--
  SHORTS 06 — TALKING HEAD (2 × 1080 × 1920, PNG z przezroczystością)

  Oprawa filmu, w którym ktoś mówi wprost do kamery. Dwa pliki na jeden klip:

    A. PYTANIE — na pierwsze sekundy. Pytanie stoi nad głową mówiącego,
       podpis pod nim. To ono zatrzymuje przewijanie.
    B. NAPIS  — na resztę klipu. Sam znak u góry i pas na napisy u dołu.

  Oba pliki mają czysty środek, więc twarz nigdy nie ląduje pod przyciemnieniem.
  Napis w wariancie B pokazuje docelowy krój i stopień pisma: jeżeli napisy
  wypalasz w programie montażowym, ustaw w nim Jost Medium ≈ 67 px
  (6,2% szerokości kadru), interlinia 1,22, kolor #EFE7D2.
-->

<body data-wyjazd="ziemia-swieta">

<!-- ═══════════ A · PYTANIE ═══════════ -->
<div class="p-canvas p-canvas--9x16 is-overlay" data-export="shorts-06-th-pytanie" data-kadr="Kadr 1 · pytanie"
     data-export-alpha="1" data-safe="shorts">

  <div class="p-scrim scrim-gora"></div>
  <div class="p-scrim scrim-dol"></div>

  <div class="p-stack p-stack--between p-inset-shorts p-inset-icons p-layer">

    <div>
      <div class="p-lockup p-lockup--cream" style="--sygnet:8cqw;">
        <span class="p-sygnet"></span>
        <span class="p-lockup__word">Palmieri</span>
      </div>

      <p class="p-eyebrow" style="margin-top:var(--p-space-4);">Pytacie nas o to najczęściej</p>

      <h1 class="p-title" style="margin-top:var(--p-space-2); font-size:var(--p-step-3); max-width:74cqw;"
          data-p="pytanie">
        Czym pielgrzymka różni się od wycieczki?
      </h1>
    </div>

    <div class="p-row" style="gap:var(--p-space-3); align-items:center;">
      <i class="p-diamond"></i>
      <div>
        <p class="p-title p-title--sm" style="font-size:var(--p-step-2);" data-p="opiekun">
          ks. Marek Wiśniewski
        </p>
        <p class="p-label" style="margin-top:var(--p-space-1); color:var(--p-cream-60);"
           data-p="opiekunRola">
          Opiekun duchowy grupy
        </p>
      </div>
    </div>

  </div>
</div>

<!-- ═══════════ B · NAPIS ═══════════ -->
<div class="p-canvas p-canvas--9x16 is-overlay" data-export="shorts-06-th-napis" data-kadr="Kadr 2 · napis"
     data-export-alpha="1" data-safe="shorts">

  <div class="p-scrim scrim-gora scrim-gora--niski"></div>
  <div class="p-scrim scrim-dol"></div>

  <div class="p-stack p-stack--between p-inset-shorts p-inset-icons p-layer">

    <div class="p-row p-row--between">
      <div class="p-lockup p-lockup--cream" style="--sygnet:8cqw;">
        <span class="p-sygnet"></span>
        <span class="p-lockup__word">Palmieri</span>
      </div>
      <span class="p-badge p-badge--cream" data-p="kierunek">Ziemia Święta</span>
    </div>

    <div>
      <div class="p-rule p-rule--solid" style="--rule-w:20cqw; margin-bottom:var(--p-space-3);">
        <i class="p-diamond"></i>
      </div>
      <p class="p-napis" data-p="napis">
        Program układa się wokół Mszy, nie wokół listy zabytków
      </p>
    </div>

  </div>
</div>

</body>
</html>
