<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Palmieri — Story 05 · Program dzień po dniu</title>
<link rel="stylesheet" href="../brand/fonts.css">
<link rel="stylesheet" href="../brand/tokens.css">
<link rel="stylesheet" href="../brand/palmieri.css">
<script defer src="../brand/sygnet.js"></script>
<script defer src="../content/wyjazdy.js"></script>
<script defer src="../content/apply.js"></script>
</head>

<!--
  STORY 05 — PROGRAM DZIEŃ PO DNIU (1080 × 1920)
  Zajawka trasy. Pokazujemy pierwsze dni i odsyłamy po pełny program.
  Wiersze bierze z pola `program` — para [numer dnia, opis].
-->

<body data-wyjazd="ziemia-swieta">

<div class="p-canvas p-canvas--9x16" data-export="story-05-program" data-safe="story">

  <div class="p-photo p-photo--duotone" data-photo style="opacity:.42;"></div>
  <div class="p-scrim p-scrim--full"></div>
  <div class="p-grain"></div>

  <div class="p-stack p-stack--between p-inset-story p-layer">

    <div>
      <div class="p-lockup p-lockup--gold" style="--sygnet:8.4cqw;">
        <span class="p-sygnet"></span>
        <span class="p-lockup__word">Palmieri</span>
      </div>

      <p class="p-eyebrow" style="margin-top:var(--p-space-5);" data-p="kierunek">Ziemia Święta</p>
      <h1 class="p-title" style="margin-top:var(--p-space-2); font-size:var(--p-step-3);">
        Program dzień po dniu
      </h1>
      <div class="p-rule p-rule--solid" style="--rule-w:22cqw; margin-top:var(--p-space-3);">
        <i class="p-diamond"></i>
      </div>
    </div>

    <ol class="p-list" data-p-program="program" style="gap:var(--p-space-3);">
      <li class="p-list__item" style="align-items:flex-start;">
        <span class="p-list__no" data-slot="numer" style="min-width:8cqw;">01</span>
        <span class="p-list__text" data-slot="opis" style="font-size:var(--p-step-1); line-height:1.30;">
          Warszawa — Tel Awiw.
        </span>
      </li>
    </ol>

    <div>
      <div class="p-hr"></div>
      <div class="p-row p-row--between" style="margin-top:var(--p-space-3);">
        <p class="p-label" style="color:var(--p-cream-60);">Pełny program</p>
        <span class="p-cta p-cta--ghost" data-p="marka.www">palmieri.pl</span>
      </div>
    </div>

  </div>
</div>

</body>
</html>
