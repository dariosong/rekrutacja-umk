<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Palmieri — Shorts 05 · Plansza końcowa</title>
<link rel="stylesheet" href="../brand/fonts.css">
<link rel="stylesheet" href="../brand/tokens.css">
<link rel="stylesheet" href="../brand/palmieri.css">
<script defer src="../brand/sygnet.js"></script>
<script defer src="../content/wyjazdy.js"></script>
<script defer src="../content/apply.js"></script>
</head>

<!--
  SHORTS 05 — PLANSZA KOŃCOWA (1080 × 1920)
  Ostatnie 2 sekundy: znak w wersji pionowej, hasło, jedno wezwanie do działania.
  Wezwanie leży nad pasem interfejsu, żeby nie zniknęło pod opisem filmu.
-->

<body data-wyjazd="ziemia-swieta">

<div class="p-canvas p-canvas--9x16" data-export="shorts-05-endcard" data-safe="shorts">

  <div class="p-frame" style="--frame-inset:4.6cqw;"></div>
  <div class="p-arc" style="width:86cqw; height:86cqw; left:7cqw; top:26cqh; --arc-opacity:.10;"></div>
  <div class="p-grain"></div>

  <div class="p-stack p-stack--between p-center p-inset-shorts p-layer">

    <span></span>

    <div class="p-lockup p-lockup--v p-lockup--gold" style="--sygnet:34cqw;">
      <span class="p-sygnet"></span>
      <span class="p-lockup__word">Palmieri</span>
      <span class="p-lockup__sub" data-p="marka.rola">Biuro pielgrzymkowe · Toruń</span>
    </div>

    <div>
      <p class="p-quote p-light" data-p="marka.haslo" style="font-size:var(--p-step-3);">
        Pielgrzymki dla wymagających
      </p>

      <div class="p-rule" style="--rule-w:24cqw; margin:var(--p-space-4) auto;">
        <i class="p-diamond"></i>
      </div>

      <p class="p-title p-title--sm" style="margin-bottom:var(--p-space-3);" data-p="marka.www">
        palmieri.pl
      </p>
      <span class="p-cta">Pełny program w opisie</span>
    </div>

  </div>
</div>

</body>
</html>
