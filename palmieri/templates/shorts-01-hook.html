<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Palmieri — Shorts 01 · Plansza otwierająca</title>
<link rel="stylesheet" href="../brand/fonts.css">
<link rel="stylesheet" href="../brand/tokens.css">
<link rel="stylesheet" href="../brand/palmieri.css">
<script defer src="../brand/sygnet.js"></script>
<script defer src="../content/wyjazdy.js"></script>
<script defer src="../content/apply.js"></script>
</head>

<!--
  SHORTS 01 — PLANSZA OTWIERAJĄCA (1080 × 1920)
  Pierwsze 1,5 sekundy filmu. Jedno zdanie, jedna myśl, znak u góry.
  Treść mieści się między pasem tytułu (góra) a opisem i ikonami (dół i prawa).
-->

<body data-wyjazd="ziemia-swieta">

<div class="p-canvas p-canvas--9x16" data-export="shorts-01-hook" data-safe="shorts">

  <div class="p-photo p-photo--duotone" data-photo></div>
  <div class="p-scrim p-scrim--soft"></div>
  <div class="p-scrim p-scrim--bottom"></div>
  <div class="p-grain"></div>
  <p class="p-photo-note">Zdjęcie zastępcze</p>

  <!-- łuk: echo okręgu z sygnetu, nigdy pod znakiem -->
  <div class="p-arc" style="width:132cqw; height:132cqw; left:-46cqw; bottom:-40cqw;"></div>

  <div class="p-stack p-stack--between p-inset-shorts p-inset-icons p-layer">

    <div class="p-lockup p-lockup--gold" style="--sygnet:9cqw;">
      <span class="p-sygnet"></span>
      <span class="p-lockup__word">Palmieri</span>
    </div>

    <div>
      <p class="p-eyebrow" data-p="eyebrow">Pielgrzymka · 8 dni</p>
      <h1 class="p-title p-title--hook" style="margin-top:var(--p-space-3);" data-p="hook">
        Wróć z tej drogi kimś innym
      </h1>
      <div class="p-rule" style="--rule-w:32cqw; margin-top:var(--p-space-4);">
        <i class="p-diamond"></i>
      </div>
      <p class="p-lead" style="margin-top:var(--p-space-4); max-width:64cqw;" data-p="lead">
        Osiem dni w miejscach, w których Ewangelia przestaje być tekstem.
      </p>
    </div>

    <div class="p-row" style="gap:var(--p-space-2); flex-wrap:wrap;">
      <span class="p-badge" data-p="kierunek">Ziemia Święta</span>
      <span class="p-badge" data-p="terminKrotki">14–21 X 2026</span>
    </div>

  </div>
</div>

</body>
</html>
