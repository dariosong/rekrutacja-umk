<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Palmieri — Story 01 · Kadr ze zdjęciem</title>
<link rel="stylesheet" href="../brand/fonts.css">
<link rel="stylesheet" href="../brand/tokens.css">
<link rel="stylesheet" href="../brand/palmieri.css">
<script defer src="../brand/sygnet.js"></script>
<script defer src="../content/wyjazdy.js"></script>
<script defer src="../content/apply.js"></script>

<!--
  STORY 01 — KADR ZE ZDJĘCIEM (1080 × 1920)
  Podstawowa relacja: pełnoekranowe zdjęcie, nazwa kierunku i jedno wezwanie.
  Zdjęcie zawsze pod przyciemnieniem — księga wymaga tego pod znakiem.
  Treść omija awatar u góry i pole odpowiedzi u dołu.
-->

<body data-wyjazd="ziemia-swieta">

<div class="p-canvas p-canvas--9x16" data-export="story-01-zdjecie" data-safe="story">

  <div class="p-photo p-photo--duotone" data-photo></div>
  <div class="p-scrim p-scrim--both"></div>
  <div class="p-grain"></div>
  <p class="p-photo-note">Zdjęcie zastępcze</p>

  <div class="p-stack p-stack--between p-inset-story p-layer">

    <div class="p-row p-row--between">
      <div class="p-lockup p-lockup--cream" style="--sygnet:8.4cqw;">
        <span class="p-sygnet"></span>
        <span class="p-lockup__word">Palmieri</span>
      </div>
      <span class="p-badge p-badge--cream" data-p="dni">8 dni</span>
    </div>

    <div>
      <p class="p-eyebrow" data-p="podtytul">Jerozolima · Betlejem · Galilea</p>

      <h1 class="p-title p-title--xl" style="margin-top:var(--p-space-2);" data-p="kierunek">
        Ziemia Święta
      </h1>

      <div class="p-rule" style="--rule-w:28cqw; margin-block:var(--p-space-4);">
        <i class="p-diamond"></i>
      </div>

      <div class="p-meta">
        <span data-p="termin">14–21 października 2026</span>
        <span data-p="wylot">Wylot z Warszawy</span>
      </div>

      <p class="p-lead" style="margin-top:var(--p-space-3); max-width:74cqw;" data-p="lead">
        Osiem dni w miejscach, w których Ewangelia przestaje być tekstem.
      </p>

      <span class="p-cta" style="margin-top:var(--p-space-4);">Link w BIO</span>
    </div>

  </div>
</div>

</body>
</html>
